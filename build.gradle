plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '8.3.9'
    id 'org.beryx.jlink' version '3.2.1'
}

group = 'io.github.wojciechkoziestanski'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.palexdev:materialfx:11.13.9'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'com.h2database:h2:2.2.224'
    // Apache PDFBox - w pełni modularna biblioteka do PDF
    implementation 'org.apache.pdfbox:pdfbox:2.0.29'
}

javafx {
    version = "17"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'io.github.wojciechkoziestanski.Main'
    mainModule = 'io.github.wojciechkoziestanski'
    applicationDefaultJvmArgs = ['--add-reads', 'io.github.wojciechkoziestanski=ALL-UNNAMED']
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['--add-reads', 'io.github.wojciechkoziestanski=ALL-UNNAMED']
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/dependencies"
}

jar {
    manifest {
        attributes(
                'Main-Class': 'io.github.wojciechkoziestanski.Main',
                'Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' ')
        )
    }
}